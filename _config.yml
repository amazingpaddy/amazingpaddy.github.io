          - **Developed a versatile data translation layer** that enabled seamless communication between the payment engine and various internal applications by **translating proprietary formats** (fixed-width, JSON) into a standardized messaging structure (ISO 20022 XML).
          - **Enhanced system observability and quality** by setting up application monitoring dashboards using the **ELK stack** and automating functional tests with the **Cucumber** framework, providing real-time visibility into performance and ensuring high code quality.
          - **Streamlined the CI/CD pipeline** by developing **Jenkins pipelines** with Groovy and shell scripting, automating the build, test, and deployment of code changes.
          - **Automated development tasks** by creating **Python scripts** to generate performance reports and demo tools, improving overall team efficiency.
