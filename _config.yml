          **Project Details**: This initiative focuses on designing and developing a comprehensive framework to automate the generation of critical regulatory and End-of-Day Contract (EODc) reports for RBC's US subsidiaries, including Georgia Bank and City National Bank. As part of this effort, I also spearheaded the creation of the EODc Compliance Checker, a key internal tool that validates daily contract reports to ensure they meet both industry and internal standards. The project leverages a modern technology stack to build robust, scalable, and secure applications that support key business operations and regulatory compliance.
          
          **Roles and Responsibilities**:
          - **Engineered** a scalable, end-to-end data solution using **Java and Apache Spark** to automate the generation of critical regulatory and EODc reports.
          - **Architected and developed** the **EODc Compliance Checker**, a Java-based application that validates complex daily contract reports and **ensured compliance with internal and industry standards**.
          - **Modernized** application components by migrating from **Java 8 to Java 17** and **Spring 4 to Spring 6**, improving performance and ensuring compatibility with modern standards.
          - **Led** the migration of **CI/CD pipelines from Jenkins to GitHub Actions**, **streamlining deployment workflows** and **reducing deployment time**.
          - **Managed** and **resolved** high-priority **P1/P2 security vulnerabilities** across multiple applications, maintaining compliance with organizational and industry standards.
          - **Optimized** data processing for voluminous **EODc data packages**, **exceeding 200GB**, using multi-threading techniques to ensure high performance.
          - **Maintained** a high level of code quality by implementing **unit tests with over 90% coverage**, integrating **Sonar Lint** for static analysis, and developing **functional test cases** with the **Cucumber Framework**.
          - **Collaborated** with **Agile** teams and **business analysts** to translate complex business requirements into technical solutions and ensure the timely delivery of reports.
