          **Project Details:** Cash Management Transactions (CMT) - Real-Time Payment Orchestration

          Engineered and implemented a **high-performance, low-latency Internal Payment Engine (IPM)** designed to orchestrate the entire lifecycle of incoming and outgoing **SCT** and **Cross-Border** transactions. The resilient, **event-driven architecture**, built using **Java 8**, **Apache Spark Structured Streaming**, **Kafka**, and **HBase**, managed communication with external banking hubs and numerous internal systems (e.g., Ledger, Billing), ensuring real-time integrity and finality of payments. Delivered using **Agile methodologies**.

          **Roles and Responsibilities:**
          - **Engineered a scalable, real-time internal payment engine (IPM)** using **Java 8** and **Apache Spark Structured Streaming** to orchestrate high-volume payment transactions and directly support critical business operations.
          - **Designed and built a resilient, event-driven data pipeline** with **Kafka** and **HBase** that enabled the real-time ingestion, storage, and analysis of transaction data, ensuring data integrity for downstream systems.
